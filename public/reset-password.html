<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password • Empower Nyamagabe</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="auth-shell" style="min-height: 100vh;">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <a href="/login" class="auth-back"><i class="fas fa-arrow-left"></i> Back to login</a>
        <h1 style="margin-top:0.5rem;">Reset your password</h1>
        <p class="muted">Enter a new password for your account.</p>
      </div>

      <div id="resetAlert" class="auth-alert"></div>

      <form id="resetForm" class="form-modern">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Reset token</label>
          <input type="text" id="token" required placeholder="Paste the token from your email" />
          <small class="helper-text">If you opened this page from the email, this should already be filled.</small>
        </div>
        <div class="form-group">
          <label>New password</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="Minimum 6 characters" />
        </div>
        <div class="form-group">
          <label>Confirm password</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="Repeat your new password" />
        </div>

        <button class="btn btn-primary btn-full" type="submit" id="resetBtn">
          <i class="fas fa-key"></i> Update Password
        </button>

        <div class="muted" style="margin-top: 0.75rem; font-size: 0.9rem;">
          Don’t have a token? Request a reset from the login page.
        </div>
      </form>
    </div>
  </div>

  <script src="/reset-password.js" defer></script>
</body>
</html>
